<!DOCTYPE html>
<head>
    <title>Centro cultural</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <h3 id="h_taller">Ingrese la información de su taller</h3>
    <form action="#">
        <label for="campo_taller">Nombre</label>
        <input id="campo_taller" name="nombre_taller" type="text" placeholder="Taller de Cerámica">

        <label for="campo_descripcion">Descripción</label>
        <textarea name="descripcion" id="campo_descripcion" rows="2"></textarea>

        <label for="campo_actividad">Actividad que se ofrece</label>
        <input id="campo_actividad" name="actividad" type="text" placeholder="Costura para principiantes">

        <label for="campo_rubro">Rubro al que pertenece</label>
        <input id="campo_rubro" name="rubro" type="text" placeholder="Artesanías">

        <label for="campo_contacto">Contacto</label>
        <input id="campo_contacto" name="contacto" type="text" placeholder="Teléfono o redes sociales">

        <label for="campo_logo">Logotipo</label>
        <input id="campo_logo" name="logo" type="file" accept="image/png, image/jpeg, image/webp">

        <button type="submit">Ingresar taller</button>
    </form>
</body>
</html>
