<!DOCTYPE html>
<head>
    <title>Registro</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <h3 id="h_registro">Registrese como colaborador</h3>
    <form action="talleres.html">
        <label for="campo_nombre">Nombre y apellido</label>
        <input id="campo_nombre" name="nombre_colaborador" type="text" placeholder="David Pérez">

        <label for="campo_telefono">Teléfono</label>
        <input id="campo_telefono" name="telefono" type="int" placeholder="1102345678">

        <label for="campo_mail">Mail</label>
        <input id="campo_mail" name="mail" type="mail" placeholder="davidperez@colaborar.com">

        <button type="submit">Registrarse</button>
    </form>
</body>
</html>
