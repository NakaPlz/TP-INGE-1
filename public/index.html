<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción a Talleres - TalleresEnMapa</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Explora Talleres</h1>
            <a href="admin.html" class="btn btn-primary">Área Creadores</a>
        </header>

        <main id="workshop-list" class="grid">
            <!-- Workshops will be loaded here -->
        </main>
    </div>

    <!-- Enrollment Modal -->
    <div id="enroll-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modal-title" style="margin-bottom: 1.5rem;">Inscribirse</h2>
            <form id="enroll-form">
                <input type="hidden" id="enroll-workshop-id">
                <div class="form-group">
                    <label for="student-name">Nombre Completo</label>
                    <input type="text" id="student-name" required placeholder="Tu nombre">
                </div>
                <div class="form-group">
                    <label for="student-email">Email</label>
                    <input type="email" id="student-email" required placeholder="tu@email.com">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Confirmar Inscripción</button>
            </form>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        // Specific student logic
        document.addEventListener('DOMContentLoaded', () => {
            loadWorkshops();
        });

        const enrollForm = document.getElementById('enroll-form');
        enrollForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const workshopId = document.getElementById('enroll-workshop-id').value;
            const studentName = document.getElementById('student-name').value;
            const studentEmail = document.getElementById('student-email').value;

            try {
                const res = await fetch('/api/enroll', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ workshopId, studentName, studentEmail })
                });
                if (res.ok) {
                    alert('¡Inscripción exitosa!');
                    closeModal();
                } else {
                    alert('Error al inscribirse');
                }
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
