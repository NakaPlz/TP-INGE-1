<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Creadores - TalleresEnMapa</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Panel de Creadores</h1>
            <a href="index.html" class="btn btn-primary">Volver al Inicio</a>
        </header>

        <!-- Login Form -->
        <div id="login-section">
            <h2 style="text-align: center; margin-bottom: 2rem;">Iniciar Sesión</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Usuario (admin)</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label>Contraseña (123)</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Ingresar</button>
            </form>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-section" style="display: none;">
            <h2 style="margin-bottom: 2rem;">Agregar Nuevo Taller</h2>
            <form id="add-workshop-form">
                <div class="form-group">
                    <label>Título del Taller</label>
                    <input type="text" id="ws-title" required>
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="ws-description" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label>Fecha</label>
                    <input type="date" id="ws-date" required>
                </div>
                <div class="form-group">
                    <label>Ubicación</label>
                    <input type="text" id="ws-location" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Publicar Taller</button>
            </form>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        const loginForm = document.getElementById('login-form');
        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    loginSection.style.display = 'none';
                    dashboardSection.style.display = 'block';
                } else {
                    alert('Credenciales incorrectas');
                }
            } catch (err) {
                console.error(err);
            }
        });

        const addWSForm = document.getElementById('add-workshop-form');
        addWSForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('ws-title').value;
            const description = document.getElementById('ws-description').value;
            const date = document.getElementById('ws-date').value;
            const location = document.getElementById('ws-location').value;

            try {
                const res = await fetch('/api/workshops', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, description, date, location })
                });
                if (res.ok) {
                    alert('Taller publicado con éxito');
                    addWSForm.reset();
                } else {
                    alert('Error al publicar taller');
                }
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
